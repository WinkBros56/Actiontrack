[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actiontrack"
version = "0.1.0"
description = "Track action items from markdown meeting notes and draft follow-up emails (never sends)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
actiontrack = "actiontrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
